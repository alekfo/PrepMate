server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name prepstats.pro www.prepstats.pro;

    location / {
        return 301 https://prepstats.pro$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    server_name www.prepstats.pro;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    return 301 https://prepstats.pro$request_uri;
}

server {
    listen 443 ssl;
    server_name prepstats.pro;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /static/;
    }

    location = /favicon.ico {
        alias /static/favicon.ico;
        access_log off;
    }

    location = /robots.txt {
        alias /static/robots.txt;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}