server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name prepstats.pro www.prepstats.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://prepstats.pro$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    server_name www.prepstats.pro;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    return 301 https://prepstats.pro$request_uri;
}

server {
    listen 443 ssl;
    server_name prepstats.pro;

    ssl_certificate     /etc/letsencrypt/live/prepstats.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepstats.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /static/;
    }

    # Наружу /media/ не отдаём напрямую — там лежат фото резюме реальных людей.
    # Доступ только через Django (resumes:photo, проверяет владельца) с
    # переброской на internal-location через X-Accel-Redirect.
    location /protected-media/ {
        internal;
        alias /media/;
    }

    location = /favicon.ico {
        alias /static/favicon.ico;
        access_log off;
    }

    location = /robots.txt {
        alias /static/robots.txt;
        access_log off;
    }

    client_max_body_size 6m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}

# --- Новый тестовый проект: HTTP -> HTTPS + ACME ---
server {
    listen 80;
    server_name quizcrowd.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quizcrowd.online$request_uri;
    }
}

# --- Новый тестовый проект: HTTPS ---
server {
    listen 443 ssl;
    server_name quizcrowd.online;

    ssl_certificate     /etc/letsencrypt/live/quizcrowd.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizcrowd.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 6m;

    location /static/ {
        alias /static-quiz/;
    }

    location /ws/ {
        proxy_pass http://quiz-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://quiz-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}